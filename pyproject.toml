[project]
name = "embed_cd"
version = "0.36.0"
description = "Engine for the EMBED-CD QGIS plugin: tiled year-over-year change maps from AlphaEarth satellite embeddings, plus an editable classifier head. QGIS-free, testable."
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
# GDAL is deliberately absent: the engine uses osgeo.gdal, which ships with QGIS and is not
# reasonably pip-installable. That is the whole reason rasterio was dropped — the plugin has
# to work with no pip step at all. Installing this package is only for testing the engine
# outside QGIS, and even then GDAL has to come from somewhere else.
dependencies = [
    "numpy",
    "scipy",     # ndimage (connected components) and optimize (the logistic head)
    "pyarrow",   # reads the published COG index (parquet), once
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embed_cd"]
