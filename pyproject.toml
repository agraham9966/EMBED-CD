[project]
name = "tessera_paint"
version = "0.1.0"
description = "Engine for the TESSERA QGIS similarity/mask tool: fetch precomputed pixel embeddings and run similarity/masking. QGIS-free, testable."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "geotessera",   # Tessera Paint only
    "pyarrow",      # AlphaEarth Change: reads the published COG index (parquet)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessera_paint"]
